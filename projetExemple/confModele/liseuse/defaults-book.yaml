# --- Chemins de ressources (images...) ---
# Les .md referencent leurs images en relatif ("mmd/xxx.png") ; Pandoc
# resout ces chemins depuis le repertoire de lancement, pas depuis le
# fichier source. On liste donc ici les dossiers des LOTs : a completer
# a chaque nouveau LOT (filesLOT02, ...).
resource-path: [".", "_projet", "filesANN", "filesLOT01", "filesLOT02", "filesLOT03", "filesLOT04", "filesLOT05", "filesLOT06", "filesLOT07", "filesPRES", "FormationSAU"]

# --- Filtre Pandoc (Lua) ---
filters: ["conf/filtre.lua"]
# Même filtre Lua que le profil HTML, appliqué ici à la pipeline
# Pandoc → LaTeX. Permet des transformations de l'AST communes
# aux deux formats de sortie.

# --------------------------------------------------------
# TABLE DES MATIÈRES
# --------------------------------------------------------
top-level-division: chapter
toc: true                         # Active la table des matières
# NB : "lof"/"lot" ne sont PAS des clés racine valides (confirmé par
# test : "Unknown option \"lof\""). Ce sont des variables de template
# LaTeX, déplacées sous "variables:" plus bas.
toc-depth: 3

# --------------------------------------------------------
# NUMÉROTATION DES SECTIONS
# --------------------------------------------------------
number-sections: true
# Active la numérotation des titres.
# NB : "number-depth" (Quarto) n'existe pas dans Pandoc pur.
# Pour limiter la profondeur de numérotation, voir "secnumdepth"
# dans la section "variables" ci-dessous (à ajuster/vérifier
# selon le rendu, ce n'est pas garanti supporté par tous les templates).

# --------------------------------------------------------
# MOTEUR LATEX
# --------------------------------------------------------
pdf-engine: lualatex
# Moteur de compilation LaTeX. LuaLaTeX est requis ici car :
# - mainfont/sansfont/monofont utilisent fontspec (polices système OTF/TTF)
# - le package "svg" peut nécessiter des appels externes (Inkscape)
# Alternative possible : xelatex (même support fontspec, sans Lua)
# ATTENTION : la clé se nomme bien "pdf-engine" (pas "latex_engine",
# qui était ignoré silencieusement dans la version précédente).

# NB : "keep-tex" n'existe PAS dans Pandoc (confirmé par test direct :
# "Unknown option \"keep-tex\""). C'est une fonctionnalité de R Markdown/
# knitr, jamais reprise par Pandoc lui-même (voir jgm/pandoc#2004).
# Pour inspecter le LaTeX intermédiaire, génère-le directement en sortie :
#   pandoc fichier.md -s -o fichier.tex --defaults=defaults.yaml
# (remplace juste l'extension de sortie, sans toucher au reste du fichier).

# --------------------------------------------------------
# NOTES ET RÉFÉRENCES
# --------------------------------------------------------
reference-location: document
# Les notes de bas de page et références bibliographiques sont regroupées
# EN FIN DE DOCUMENT (vs "block" = fin de bloc, "section" = fin de section).

# --------------------------------------------------------
# LANGUE
# --------------------------------------------------------
# ATTENTION : "lang" n'est PAS une clé racine valide d'un fichier de
# défauts (testé : provoque "Unknown option \"lang\""). C'est une
# métadonnée : elle doit passer soit par le YAML du .md, soit ici
# sous "metadata:". Active les règles typographiques françaises dans
# LaTeX (babel/polyglossia) : espaces insécables avant : ; ! ?, etc.
metadata:
  lang: 'fr'

# --------------------------------------------------------
# CODE SOURCE
# --------------------------------------------------------
highlight-style: pygments         # Thème de coloration syntaxique.
# NB : "code-line-numbers" et "code-block-border-left" sont des options
# Quarto qui n'ont aucun effet en Pandoc pur. Pour numéroter les lignes
# d'un bloc de code, ajoute la classe .numberLines directement dans le
# Markdown (```{.python .numberLines}), ou fais-le via ton filtre Lua.

# --------------------------------------------------------
# VARIABLES DE TEMPLATE LATEX
# (polices, couleurs, mise en page, classe de document...)
# Ces clés DOIVENT être imbriquées sous "variables" : à la racine du
# fichier de défauts, Pandoc les ignore silencieusement.
# --------------------------------------------------------
variables:
  toc-title: "Table des Matières"  # Titre de la TdM
  lof: false                        # Liste des figures (List of Figures) après la TdM
  lot: false                        # Liste des tableaux (List of Tables) après la TdM

  # --- Polices ---
  # mainfont, sansfont et monofont ne sont pas ici : conf/fonts.tex les choisit
  # selon ce que la machine a d'installé (Calibri, sinon Carlito...).
  fontsize: 11pt                # (clé correcte : "fontsize", pas "font-size")
  linestretch: 1.1               # Interligne (×1.1)

  # --- Couleurs des liens ---
  linkcolor: blue      # Liens internes (renvois entre sections, \ref)
  urlcolor: olive      # URLs externes
  toccolor: violet     # Liens dans la table des matières

  # --- Classe de document ---
  documentclass: scrbook
  # Classe LaTeX KOMA-Script. Alternatives : scrartcl, scrbook, scrreprt.

  papersize: a4        # Format A4

  classoption:
    - twoside          # Mode recto-verso
    - DIV=12           # Facteur de division KOMA pour les marges auto
    - parskip=half     # Espacement entre paragraphes = demi-ligne
    - portrait         # Orientation portrait

  geometry:            # Marges précises via le package LaTeX "geometry"
    - top=30mm
    - bottom=30mm
    - left=30mm
    - right=20mm

  secnumdepth: 1
  # Tentative de remplacement de "number-depth" (Quarto) : limite la
  # numérotation aux titres de niveau 1. À VÉRIFIER : selon le template
  # LaTeX utilisé, cette variable peut ne pas être prise en compte.
  # Solution garantie : ajouter "\setcounter{secnumdepth}{1}" dans
  # header-includes ci-dessous.

# --------------------------------------------------------
# TABLEAUX / FIGURES
# --------------------------------------------------------
# NB : "fig-align", "fig-pos", "fig-cap-location", "tbl-colwidths" et
# "tbl-cap-location" sont des options Quarto sans équivalent direct en
# Pandoc pur. Pour forcer la position d'une figure, utilise l'attribut
# sur l'image elle-même dans le Markdown, par ex. :
#   ![légende](image.png){fig-pos="H"}
# et assure-toi que \usepackage{float} est chargé (ajouté ci-dessous).

# --------------------------------------------------------
# INCLUSIONS LATEX (include-in-header)
# Blocs LaTeX injectés dans le préambule du .tex généré,
# AVANT \begin{document}.
# NB IMPORTANT (vérifié par test direct avec pandoc 3.1.3) :
# chaque élément de la liste "include-in-header" doit être un CHEMIN
# DE FICHIER (chaîne), pas un objet "{text: ...}". La syntaxe
# "- text: |" provoque l'erreur :
#   "Error in $: parsing Text failed, expected String, but encountered Array"
# Le préambule LaTeX est donc externalisé dans conf/preamble.tex,
# chemin relatif au répertoire d'où la commande pandoc est lancée.
# --------------------------------------------------------
include-in-header:
  - conf/fonts.tex
  - conf/preamble.tex
