# =====================================================================
#  DICTIONNAIRE DES MESSAGES
#
#  Alimente la liste deroulante « Dictionnaire des messages » du portail
#  d'accueil (conf/modele-accueil.template.html), placee a droite de la
#  liste « Ouvrir un document ».
#
#  messages-href   = page cible (chemin depuis la RACINE du projet, comme
#                    les "href" de la bibliotheque ci-dessus).
#  messages        = groupes (optgroup) -> items.
#  Chaque item :
#     code    : identifiant du message affiche en tete de ligne (ex. IE501)
#     title   : libelle du message
#     anchor  : ancre {#...} du titre correspondant dans
#               filesANN/SFD-CID-SDS-VN-BS-bANN-messages.md
#
#  Le lien construit est :  <messages-href>#<anchor>
#  Exemple : IE501 -> filesANN/SFD-CID-SDS-VN-BS-bANN-messages.html#501
#
#  Pour ajouter un message : ajouter le titre + son ancre {#xxx} dans le
#  .md des messages, puis un item { code, title, anchor } dans le bon
#  groupe ci-dessous.
# =====================================================================
messages-href: "filesANN/SFD-CID-SDS-VN-BS-bANN-messages.html"
