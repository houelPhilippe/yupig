# Fichier de définition des ressources complémentaires à copier lors de la compilation HTML
# Par défaut, les dossiers (img, conf, css, images, media, assets) sont déjà copiés automatiquement.
# Vous pouvez spécifier ici des fichiers ou dossiers supplémentaires.

