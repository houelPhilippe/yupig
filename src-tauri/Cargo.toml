[package]
name = "veille"
version = "1.0.2"
description = "Tableau de bord de veille — agrégateur RSS/Atom autonome"
authors = ["Philippe Houel"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "veille_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "charset"] }
feed-rs = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
regex = "1"
thiserror = "2"
quick-xml = "0.37"

[features]
# Utilisé par `tauri dev` / `tauri build --debug`
default = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
