# Distribution Windows 11.
#
# La compilation a lieu sur une machine Windows fournie par GitHub : Tauri ne
# sait pas produire un paquet Windows depuis Linux, et une machine virtuelle
# Windows n'est pas nécessaire pour autant.
#
# Deux départs :
#   * un tag « v… » poussé sur le dépôt — le paquet est alors joint à une
#     release, nommée d'après le tag ;
#   * le bouton « Run workflow » de l'onglet Actions, pour essayer sans taguer.
#     Les fichiers sont alors dans les artefacts de l'exécution.
#
# Rien à installer ici : ni Node ni bundler, le frontend est servi tel quel
# (`frontendDist: "../src"`), et la seule dépendance est le client Tauri, que
# `cargo install` pose sur la machine de compilation.

name: Distribution Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Le jeton ne sert qu'à créer la release du tag ; rien d'autre n'est écrit.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Chaîne Rust
        uses: dtolnay/rust-toolchain@stable

      # Les dépendances compilées d'une exécution à l'autre : sans ce cache,
      # chaque essai recompile tout Tauri, soit une dizaine de minutes.
      - name: Cache des dépendances
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Version majeure figée : le client 2.x lit la configuration de ce dépôt.
      # `--locked` pour que la chaîne installée ne dépende pas du jour.
      - name: Client Tauri
        run: cargo install tauri-cli --version "^2" --locked

      # WebView2 est déjà là sous Windows 11 ; rien à embarquer.
      - name: Compilation
        run: cargo tauri build --bundles nsis,msi

      - name: Paquets produits
        uses: actions/upload-artifact@v4
        with:
          name: veille-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      # Sur un tag seulement : le paquet est joint à une release, où il se
      # télécharge sans compte GitHub.
      #
      # Par `gh`, le client GitHub, déjà installé sur la machine : l'action
      # `softprops/action-gh-release` échouait sur « Error creating asset temp
      # dir » depuis que GitHub force Node 24. Une release qui existe déjà — un
      # tag rejoué — reçoit les paquets à la place des précédents plutôt que de
      # faire échouer la compilation.
      - name: Release du tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `gh release view` sort en erreur quand la release n'existe pas : on
          # lit son code de sortie plutôt que de laisser l'erreur arrêter
          # l'étape.
          $ErrorActionPreference = 'Continue'
          $files = @(Get-ChildItem `
            src-tauri/target/release/bundle/nsis/*.exe, `
            src-tauri/target/release/bundle/msi/*.msi | ForEach-Object FullName)
          "Paquets : $($files -join ', ')"

          # Le nom de l'application est lu dans « productName », jamais écrit
          # ici : c'est celui du paquet, et une release ne peut donc pas en
          # porter un autre — la même règle que pour la version, prise dans le
          # même fichier.
          $nom = (Get-Content src-tauri/tauri.conf.json -Raw -Encoding utf8 |
            ConvertFrom-Json).productName

          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber
          } else {
            gh release create $tag $files --title "$nom $tag" `
              --notes "Paquets Windows compilés par GitHub Actions : installateur NSIS (.exe) et paquet MSI."
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
