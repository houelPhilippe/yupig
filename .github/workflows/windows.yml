# Distribution Windows 11.
#
# La compilation a lieu sur une machine Windows fournie par GitHub : Tauri ne
# sait pas produire un paquet Windows depuis Linux, et une machine virtuelle
# Windows n'est pas nécessaire pour autant.
#
# Deux départs :
#   * un tag « v… » poussé sur le dépôt — le paquet est alors joint à une
#     release, nommée d'après le tag ;
#   * le bouton « Run workflow » de l'onglet Actions, pour essayer sans taguer.
#     Les fichiers sont alors dans les artefacts de l'exécution.
#
# Rien à installer ici : ni Node ni bundler, le frontend est servi tel quel
# (`frontendDist: "../src"`), et la seule dépendance est le client Tauri, que
# `cargo install` pose sur la machine de compilation.

name: Distribution Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Le jeton ne sert qu'à créer la release du tag ; rien d'autre n'est écrit.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Chaîne Rust
        uses: dtolnay/rust-toolchain@stable

      # Les dépendances compilées d'une exécution à l'autre : sans ce cache,
      # chaque essai recompile tout Tauri, soit une dizaine de minutes.
      - name: Cache des dépendances
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Version majeure figée : le client 2.x lit la configuration de ce dépôt.
      # `--locked` pour que la chaîne installée ne dépende pas du jour.
      - name: Client Tauri
        run: cargo install tauri-cli --version "^2" --locked

      # WebView2 est déjà là sous Windows 11 ; rien à embarquer.
      - name: Compilation
        run: cargo tauri build --bundles nsis,msi

      - name: Paquets produits
        uses: actions/upload-artifact@v4
        with:
          name: veille-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      # Sur un tag seulement : le paquet est joint à une release, où il se
      # télécharge sans compte GitHub.
      - name: Release du tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Veille ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
